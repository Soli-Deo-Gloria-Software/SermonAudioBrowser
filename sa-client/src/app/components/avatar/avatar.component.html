<div class="me-2 avatar-container" (click)="onAvatarClicked()" [ngClass]="sizeClass()" [ngStyle]="{'border-radius': borderRadius }" [title]="name()">
  <span class="avatar-background w-100 h-100 bg-secondary d-inline-block"></span>
  <div class="avatar-content w-100 h-100 d-flex">
    @if (src()) {
      <img [src]="src()" />
    }
    @if (!src()) {
      <span class="mx-auto text-light" [ngClass]="textClass()">{{initials}}</span>
    }
  </div>
</div>
