<div [style.height.px]="height" [style.maxHeight.vh]="maxHeight" class="o-70">
  <div class="row h-100">
    <div class="col d-flex">
      @for (peak of peaks$ | async; track peak.index) {
        <div class="mx-auto h-100" [style.width.%]="peakWidth">
          <div class="h-100 d-flex">
            <div class="waveform-peak float-start my-auto w-100" [style.height.%]="peak.peakHeight" ></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
